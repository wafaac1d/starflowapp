[project]
name = "starflow"
version = "0.1.0"
description = "StarFlow Telegram Mini App"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15,<4",
    "alembic>=1.14",
    "apscheduler>=3.10,<4",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "geopy>=2.4,<3",
    "httpx>=0.28",
    "httpx2>=2.16,<3",
    "openai>=1.55,<4",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyswisseph>=2.10.3.2,<2.11",
    "pyyaml>=6",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "timezonefinder>=6.5,<7",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.9",
    "time-machine>=2.16",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["starflow"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["starflow"]
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "geopy.*", "swisseph.*", "timezonefinder.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]
