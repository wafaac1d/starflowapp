day_ready: День уже собран. Откройте страницу дня.
day_ready_1: Новая неделя начинается. Карта дня уже готова — откройте прогноз, чтобы настроиться на свой ритм.
day_ready_2: Вторник набирает ход. Ваш персональный разбор дня собран — загляните за подсказкой звёзд.
day_ready_3: Середина недели — время свериться с внутренним компасом. Прогноз на сегодня уже ждёт вас.
day_ready_4: Энергии дня сформировали новый узор. Откройте разбор, чтобы увидеть главные акценты четверга.
day_ready_5: Пятничный фон готов к изучению. Посмотрите, на что стоит обратить внимание перед выходными.
day_ready_6: Спокойное субботнее утро. Загляните в свой расклад, чтобы провести этот выходной в гармонии.
day_ready_7: День для отдыха и восстановления. Ваш звёздный разбор на воскресенье уже готов.
day_fallback: Разбор дня ещё собирается. Откройте приложение чуть позже.
day_button: Открыть день
tomorrow_ready: Узнайте, что вас ждёт завтра. Ночное небо уже готовит свой узор.
tomorrow_ready_1: Вечер понедельника подходит к концу. Звёзды уже выстроились для завтрашнего дня — загляните вперёд.
tomorrow_ready_2: День уступает место ночи. Узнайте, какой фон готовят планеты на завтрашнюю среду.
tomorrow_ready_3: Ночное небо собирает новые аспекты. Посмотрите разбор на четверг, чтобы встретить утро с ясностью.
tomorrow_ready_4: Впереди финал рабочей недели. Узнайте, с каким настроением звёзды встречают вашу пятницу.
tomorrow_ready_5: Выходные начинаются. Посмотрите астрологический фон на субботу и спланируйте спокойный отдых.
tomorrow_ready_6: Время замедлиться и отдохнуть. Ночной узор звёзд готов подсказать ритм для воскресенья.
tomorrow_ready_7: Новый недельный цикл на подходе. Узнайте, что звёзды готовят для вашего завтрашнего старта.
tomorrow_fallback: Узнайте, что вас ждёт завтра. Звёзды уже шепчут о контурах грядущего дня.
tomorrow_button: Узнать, что ждёт завтра
affirmation_ready: Аффирмация на сегодня уже ждёт. Откройте её и настройтесь на свой ритм.
affirmation_button: Открыть аффирмацию
onboarding_ready_1: Так и не попробовали StarFlow? Завершите регистрацию и узнайте, что звёзды говорят о вашем ритме.
onboarding_ready_2: Регистрация осталась незавершённой. Вернитесь и посмотрите свой первый разбор.
onboarding_ready_3: Звёздам нужна дата рождения. Завершите регистрацию и откройте фон дня.
onboarding_ready_4: Вы начали StarFlow и остановились на полпути. Допишите данные и загляните в разбор.
onboarding_ready_5: Один шаг отделяет вас от персонального фона. Завершите регистрацию прямо сейчас.
onboarding_ready_6: Пока регистрация не закончена, звёзды молчат. Откройте приложение и продолжите.
onboarding_ready_7: Не оставляйте StarFlow на полуслове. Завершите регистрацию и узнайте свой сегодняшний ритм.
onboarding_button: Завершить регистрацию
moon_ready: Луна на эту дату уже собрана. Откройте страницу луны.
moon_fallback: Лунный фон ещё собирается. Откройте приложение чуть позже.
moon_button: Открыть луну
