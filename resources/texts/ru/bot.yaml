refund_done: Запрос возврата записан.
subscription_ending: Продление выключено. Доступ к premium закончится через несколько дней.
invoice_subscription_title: Premium, 30 дней
invoice_subscription_description: Доступ на 30 дней. Списание повторяется, пока продление включено.
invoice_gift_title: Подарок premium
invoice_gift_description: Разовый доступ на 30 дней без продления.
invoice_topup_title: Пополнение баланса
invoice_topup_description: Звёзды на совместимость, натальную карту и вопросы астрологу.
chat_menu: |
  Что можно написать

  Прогноз
  день
  завтра
  неделя
  месяц
  луна

  Темы
  любовь
  работа
  здоровье
  финансы

  Практики
  карта
  совместимость Овен и Телец
  аффирмация
  дата встреча
  ретроград

  Счёт и люди
  баланс
  близкие
  прогноз и имя
  код и название кода
  пригласить
  подключить

  Вопрос астропомощнику можно задать своими словами.
  Платный разбор сначала называет цену. Списание только после «да».
  Разбор развлекательный и не обещает точных событий.
home_ready: '{name}, это ваш аккаунт StarFlow. В чате те же данные, что в приложении.'
home_hint: Напишите «меню», чтобы увидеть, что можно спросить.
ask_privacy: |
  Напишите «принимаю», чтобы принять соглашение о конфиденциальности.

  Текст соглашения есть в приложении.
ask_name: Как к вам обращаться?
ask_date: |
  Напишите дату рождения.
  Например, 24.11.1970.
ask_time: |
  Напишите время рождения.
  Если не знаете, напишите «не знаю».
  Например, 14:30.
ask_place: |
  Место рождения выбирается в приложении.
  Напишите «пропустить», чтобы закончить без места.
ask_zone: Напишите часовой пояс, например Europe/Moscow, или «пропустить».
