start: Starflow составляет персональный разбор по дате рождения. Откройте приложение, чтобы продолжить.
start_without_app: Приложение открывается кнопкой «Открыть StarFlow» под сообщением и кнопкой слева от поля ввода. Сейчас адрес не указан, поэтому этих кнопок нет.
open: Открыть StarFlow
start_missing_user: Не вижу отправителя сообщения.
digest: Новый разбор готов. Откройте starflow, чтобы прочитать его.
broadcast: Новое сообщение от StarFlow.
help: 'Команды открывают экран приложения: профиль, настройки, premium, условия и поддержка платежей.'
profile: Профиль хранит имя, дату и время рождения.
settings: В настройках можно вернуться к профилю и удалить данные.
premium: Premium открывает место рождения и расширенный разбор.
terms: Разбор не обещает точных событий.
paysupport: Если платёж звёздами прошёл не так, откройте экран поддержки.
delete_ask: Удалить профиль и связанные данные? Это действие нельзя отменить.
delete_confirm: Удалить данные
delete_done: Данные удалены.
delete_missing: Удалять нечего.
