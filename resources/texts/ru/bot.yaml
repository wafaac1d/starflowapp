chat_menu: |
  Можно писать прямо в этот чат. Кнопка ниже открывает приложение.

  день — прогноз на сегодня
  завтра — на завтра
  неделя — на неделю
  месяц — на месяц
  луна — лунный фон
  любовь, работа, здоровье, финансы — разбор темы
  карта — натальная карта
  совместимость Овен и Телец — пара знаков
  диалог, эмоции, ориентиры — подробнее о последней паре
  аффирмация — текст на сегодня
  дата встреча, дата поездка, дата покупка — благоприятный день
  ретроград — периоды планет
  близкие — список людей
  прогноз и имя — день этого человека
  баланс — звёзды на счёте
  код и название — погасить код
  пригласить — ссылка для друга
  подключить — Premium с баланса
  Или задайте вопрос астропомощнику.

  Платный разбор сначала называет цену. Списание только после «да».
  Разбор развлекательный и не обещает точных событий.
ask_privacy: Напишите «принимаю», чтобы принять соглашение о конфиденциальности. Кнопка ниже открывает текст соглашения.
ask_name: Как к вам обращаться?
ask_date: Напишите дату рождения в виде 24.11.1970.
ask_time: Напишите время рождения в виде 14:30 или «не знаю».
ask_place: Место рождения выбирается в приложении. Напишите «пропустить», чтобы закончить без места.
ask_zone: Напишите часовой пояс, например Europe/Moscow, или «пропустить».
price_ask: '{title} стоит {price} звёзд. Напишите «да», чтобы списать их с баланса.'
price_short: 'На балансе {balance} звёзд, этого мало для списания.'
balance_line: 'На балансе {balance} звёзд.'
code_ok: 'Код принят. На балансе {balance} звёзд.'
people_empty: Близких пока нет. Добавить человека можно в приложении.
people_head: 'Близкие. Напишите «прогноз» и имя, чтобы открыть день этого человека.'
person_missing: Такого человека в списке нет. Напишите «близкие», чтобы увидеть имена.
profile_card: '{name}, {date}, {time}. Знак {sign}. {premium}'
premium_on: Premium действует.
premium_off: Premium не подключён.
premium_ask: 'Premium на {days} дней стоит {price} звёзд. Напишите «да», чтобы списать их с баланса. Автопродления нет.'
premium_bought: 'Premium подключён. На балансе {balance} звёзд.'
reading_wait: Разбор ещё собирается. Напишите ту же фразу через минуту.
reading_error: Сейчас разбор не собрался. Напишите ту же фразу ещё раз чуть позже.
reading_partial: Часть расчёта общая, потому что время или место рождения не указаны.
limit_hit: Лимит этого разбора уже использован.
premium_only: Этот разбор входит в Premium.
compat_hint: Напишите два знака, например «совместимость Овен и Телец».
compat_need: Сначала напишите два знака, например «совместимость Овен и Телец».
compat_more: Можно написать «диалог», «эмоции» или «ориентиры», чтобы открыть эту часть пары.
retro_list: Сейчас и скоро
retro_none: Сейчас ретроградных периодов нет.
retro_hint: Напишите «ретроград» и планету, например «ретроград Меркурий», чтобы открыть разбор периода.
referral_line: 'Ссылка для приглашения: {link}. Приглашено {count}, начислено {earned}.'
chart_partial: Без времени или места рождения углы карты не считаются.
favorable_locked: 'Бесплатный день уже выбран для события «{label}». Другое событие стоит {price} звёзд. Напишите «да», чтобы списать их.'
favorable_need: Сначала напишите событие, например «дата встреча».
step_pending: Сначала закончим регистрацию.
