  sections: Разделы карты
  section_sun: Солнце
  section_sun_body: Солнце в знаке {sign} задаёт тон, в котором человеку проще проявляться и брать инициативу. Рядом с этим знаком обычно видны свой ритм, вкус к вниманию и способ держаться среди других. Это развлекательный портрет, а не обещание судьбы или точного события. Разбор не заменяет дома и не говорит, что именно произойдёт.
  section_moon: Луна
  section_moon_body: Луна в знаке {sign} описывает, как человеку привычнее переживать настроение и близость. Знак Луны говорит о реакции, а не о расписании дня. Без времени рождения эта строка не показывается, и Луна не выдумывается. Это фон для размышления, не совет и не прогноз.
  section_asc: Асцендент
  section_asc_body: Асцендент в знаке {sign} показывает, с каким первым жестом человека чаще встречают. Он есть только при известных времени и месте. Если их нет, асцендент не подставляется наугад. Это манера входа в разговор, а не обещание характера на всю жизнь.
  section_houses: Дома
  section_houses_body: 'Дома по знакам: {houses}. Каждый дом здесь — область, где знак задаёт фон, а не список дел. Подписи написаны словами. Если времени или места рождения не было, домов нет, и они не выдуманы.'
  section_planets: Светила
  section_planets_body: 'Светила и планеты карты: {planets}. У каждой точки свой знак, и вместе они складывают портрет подробнее, чем одно Солнце. Это подписи расчёта, без обещания событий и без дневного гороскопа.'
  section_aspects: Аспекты
  section_aspects_body: 'Аспекты карты: {aspects}. Они показывают, какие точки связаны напряжением или согласием. Это схема карты, а не прогноз на день и не сравнение с другим человеком.'
